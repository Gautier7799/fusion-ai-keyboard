name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force

      - name: Build Web Dist
        run: npx vite build

      - name: Generate Fresh Android Project with Native InputConnection
        run: |
          rm -rf android capacitor.config.ts capacitor.config.json
          npx cap init "Fusion AI Keyboard" "com.gaidiamjed.fusionkeyboard" --web-dir dist
          npx cap add android

          # 1. Create method.xml
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.gaidiamjed.fusionkeyboard.MainActivity"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype
                  android:label="العربية (Fusion AI)"
                  android:imeSubtypeLocale="ar"
                  android:imeSubtypeMode="keyboard" />
              <subtype
                  android:label="English (Fusion AI)"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # 2. Inject Service in AndroidManifest.xml
          sed -i '/<\/application>/i \
                  <service \
                      android:name=".FusionKeyboardService" \
                      android:label="Fusion AI Keyboard" \
                      android:permission="android.permission.BIND_INPUT_METHOD" \
                      android:exported="true"> \
                      <intent-filter> \
                          <action android:name="android.view.InputMethod" /> \
                      </intent-filter> \
                      <meta-data \
                          android:name="android.view.im" \
                          android:resource="@xml/method" /> \
                  </service>' android/app/src/main/AndroidManifest.xml

          # 3. Create Full Native Bridge Keyboard Service
          mkdir -p android/app/src/main/java/com/gaidiamjed/fusionkeyboard
          cat << 'EOF' > android/app/src/main/java/com/gaidiamjed/fusionkeyboard/FusionKeyboardService.java
          package com.gaidiamjed.fusionkeyboard;

          import android.inputmethodservice.InputMethodService;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputConnection;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          public class FusionKeyboardService extends InputMethodService {
              private WebView webView;

              public class AndroidKeyboardBridge {
                  @JavascriptInterface
                  public void insertText(String text) {
                      InputConnection ic = getCurrentInputConnection();
                      if (ic != null && text != null) {
                          ic.commitText(text, 1);
                      }
                  }

                  @JavascriptInterface
                  public void deleteBackward() {
                      InputConnection ic = getCurrentInputConnection();
                      if (ic != null) {
                          ic.deleteSurroundingText(1, 0);
                      }
                  }

                  @JavascriptInterface
                  public void sendEnter() {
                      InputConnection ic = getCurrentInputConnection();
                      if (ic != null) {
                          ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER));
                          ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER));
                      }
                  }
              }

              @Override
              public View onCreateInputView() {
                  FrameLayout root = new FrameLayout(this);
                  int heightPx = (int) (310 * getResources().getDisplayMetrics().density);
                  root.setLayoutParams(new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, heightPx));

                  webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);

                  webView.addJavascriptInterface(new AndroidKeyboardBridge(), "AndroidKeyboard");
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/public/index.html");

                  root.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  return root;
              }
          }
          EOF

          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionAIKeyboard-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
