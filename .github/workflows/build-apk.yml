name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force

      - name: Build Web Dist
        run: npx vite build

      - name: Generate Pure Native Android Keyboard IME
        run: |
          rm -rf android capacitor.config.ts capacitor.config.json
          npx cap init "Fusion AI Keyboard" "com.gaidiamjed.fusionkeyboard" --web-dir dist
          npx cap add android

          # 1. Create method.xml
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.gaidiamjed.fusionkeyboard.MainActivity"
              android:supportsSwitchingToNextInputMethod="true">
              <subtype
                  android:label="العربية (Fusion AI)"
                  android:imeSubtypeLocale="ar"
                  android:imeSubtypeMode="keyboard" />
              <subtype
                  android:label="English (Fusion AI)"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # 2. Inject Service in AndroidManifest.xml
          sed -i '/<\/application>/i \
                  <service \
                      android:name=".FusionKeyboardService" \
                      android:label="Fusion AI Keyboard" \
                      android:permission="android.permission.BIND_INPUT_METHOD" \
                      android:exported="true"> \
                      <intent-filter> \
                          <action android:name="android.view.InputMethod" /> \
                      </intent-filter> \
                      <meta-data \
                          android:name="android.view.im" \
                          android:resource="@xml/method" /> \
                  </service>' android/app/src/main/AndroidManifest.xml

          # 3. Create Pure Native Android Views Keyboard Service
          mkdir -p android/app/src/main/java/com/gaidiamjed/fusionkeyboard
          cat << 'EOF' > android/app/src/main/java/com/gaidiamjed/fusionkeyboard/FusionKeyboardService.java
          package com.gaidiamjed.fusionkeyboard;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.inputmethodservice.InputMethodService;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.InputConnection;
          import android.widget.Button;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class FusionKeyboardService extends InputMethodService {
              private boolean isArabic = true;
              private LinearLayout rowsContainer;

              private final String[][] AR_ROWS = {
                  {"ض", "ص", "ث", "ق", "ف", "غ", "ع", "ه", "خ", "ح", "ج", "د"},
                  {"ش", "س", "ي", "ب", "ل", "ا", "ت", "ن", "م", "ك", "ط"},
                  {"ئ", "ء", "ؤ", "ر", "لا", "ى", "ة", "و", "ز", "ظ", "ذ"}
              };

              private final String[][] EN_ROWS = {
                  {"q", "w", "e", "r", "t", "y", "u", "i", "o", "p"},
                  {"a", "s", "d", "f", "g", "h", "j", "k", "l"},
                  {"z", "x", "c", "v", "b", "n", "m"}
              };

              private final String[] QUICK_WORDS = {"السلام عليكم", "شكراً جزيلاً", "بإذن الله", "تحياتي", "صباح الخير"};
              private final String[] TASHKEEL = {"َ", "ً", "ُ", "ٌ", "ِ", "ٍ", "ْ", "ّ", "ـ"};

              @Override
              public View onCreateInputView() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#121214"));
                  root.setPadding(8, 8, 8, 16);

                  // 1. AI & Predictions Toolbar
                  HorizontalScrollView toolbarScroll = new HorizontalScrollView(this);
                  toolbarScroll.setHorizontalScrollBarEnabled(false);
                  LinearLayout toolbar = new LinearLayout(this);
                  toolbar.setOrientation(LinearLayout.HORIZONTAL);
                  toolbar.setPadding(4, 4, 4, 8);

                  TextView aiBadge = new TextView(this);
                  aiBadge.setText(" ✨ Gemini AI ");
                  aiBadge.setTextColor(Color.parseColor("#FCD34D"));
                  aiBadge.setTextSize(12);
                  aiBadge.setTypeface(null, Typeface.BOLD);
                  aiBadge.setBackground(createButtonDrawable(Color.parseColor("#332402"), Color.parseColor("#F59E0B")));
                  aiBadge.setPadding(16, 8, 16, 8);
                  toolbar.addView(aiBadge);

                  for (String word : QUICK_WORDS) {
                      Button btn = new Button(this);
                      btn.setText(word);
                      btn.setTextColor(Color.parseColor("#E4E4E7"));
                      btn.setTextSize(11);
                      btn.setAllCaps(false);
                      btn.setBackground(createButtonDrawable(Color.parseColor("#27272A"), Color.parseColor("#3F3F46")));
                      btn.setPadding(14, 6, 14, 6);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                      lp.setMargins(6, 0, 6, 0);
                      btn.setLayoutParams(lp);
                      btn.setOnClickListener(v -> commitText(word + " "));
                      toolbar.addView(btn);
                  }
                  toolbarScroll.addView(toolbar);
                  root.addView(toolbarScroll);

                  // 2. Tashkeel Quick Bar
                  HorizontalScrollView tashkeelScroll = new HorizontalScrollView(this);
                  tashkeelScroll.setHorizontalScrollBarEnabled(false);
                  LinearLayout tashkeelBar = new LinearLayout(this);
                  tashkeelBar.setOrientation(LinearLayout.HORIZONTAL);
                  tashkeelBar.setPadding(2, 2, 2, 6);

                  for (String t : TASHKEEL) {
                      Button btn = new Button(this);
                      btn.setText(t);
                      btn.setTextColor(Color.WHITE);
                      btn.setTextSize(14);
                      btn.setBackground(createButtonDrawable(Color.parseColor("#1E1E24"), Color.parseColor("#2E2E38")));
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(90, 80);
                      lp.setMargins(3, 0, 3, 0);
                      btn.setLayoutParams(lp);
                      btn.setOnClickListener(v -> commitText(t));
                      tashkeelBar.addView(btn);
                  }
                  tashkeelScroll.addView(tashkeelBar);
                  root.addView(tashkeelScroll);

                  // 3. Dynamic Rows
                  rowsContainer = new LinearLayout(this);
                  rowsContainer.setOrientation(LinearLayout.VERTICAL);
                  renderKeys();
                  root.addView(rowsContainer);

                  return root;
              }

              private void renderKeys() {
                  rowsContainer.removeAllViews();
                  String[][] rows = isArabic ? AR_ROWS : EN_ROWS;

                  for (int i = 0; i < rows.length; i++) {
                      LinearLayout rowLayout = new LinearLayout(this);
                      rowLayout.setOrientation(LinearLayout.HORIZONTAL);
                      rowLayout.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                      rowLayout.setPadding(0, 3, 0, 3);

                      if (i == 2) {
                          Button langBtn = createSpecialButton(isArabic ? "EN" : "عربي", 1.2f, v -> {
                              isArabic = !isArabic;
                              renderKeys();
                          });
                          rowLayout.addView(langBtn);
                      }

                      for (String key : rows[i]) {
                          Button btn = new Button(this);
                          btn.setText(key);
                          btn.setTextColor(Color.WHITE);
                          btn.setTextSize(18);
                          btn.setTypeface(null, Typeface.BOLD);
                          btn.setAllCaps(false);
                          btn.setBackground(createButtonDrawable(Color.parseColor("#2C2C32"), Color.parseColor("#44444F")));
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 120, 1.0f);
                          lp.setMargins(3, 0, 3, 0);
                          btn.setLayoutParams(lp);
                          btn.setOnClickListener(v -> commitText(key));
                          rowLayout.addView(btn);
                      }

                      if (i == 2) {
                          Button delBtn = createSpecialButton("⌫", 1.2f, v -> deleteChar());
                          delBtn.setTextColor(Color.parseColor("#F87171"));
                          rowLayout.addView(delBtn);
                      }

                      rowsContainer.addView(rowLayout);
                  }

                  // Space & Enter Row
                  LinearLayout bottomRow = new LinearLayout(this);
                  bottomRow.setOrientation(LinearLayout.HORIZONTAL);
                  bottomRow.setPadding(0, 4, 0, 2);

                  Button emojiBtn = createSpecialButton("😊", 1.0f, v -> commitText("😊"));
                  Button spaceBtn = new Button(this);
                  spaceBtn.setText(isArabic ? "مسافة" : "space");
                  spaceBtn.setTextColor(Color.WHITE);
                  spaceBtn.setTextSize(14);
                  spaceBtn.setBackground(createButtonDrawable(Color.parseColor("#383842"), Color.parseColor("#F59E0B")));
                  LinearLayout.LayoutParams spaceLp = new LinearLayout.LayoutParams(0, 120, 4.0f);
                  spaceLp.setMargins(4, 0, 4, 0);
                  spaceBtn.setLayoutParams(spaceLp);
                  spaceBtn.setOnClickListener(v -> commitText(" "));

                  Button enterBtn = new Button(this);
                  enterBtn.setText("↵");
                  enterBtn.setTextColor(Color.BLACK);
                  enterBtn.setTextSize(20);
                  enterBtn.setTypeface(null, Typeface.BOLD);
                  enterBtn.setBackground(createButtonDrawable(Color.parseColor("#F59E0B"), Color.parseColor("#FBBF24")));
                  LinearLayout.LayoutParams enterLp = new LinearLayout.LayoutParams(0, 120, 1.3f);
                  enterLp.setMargins(4, 0, 4, 0);
                  enterBtn.setLayoutParams(enterLp);
                  enterBtn.setOnClickListener(v -> sendEnterKey());

                  bottomRow.addView(emojiBtn);
                  bottomRow.addView(spaceBtn);
                  bottomRow.addView(enterBtn);
                  rowsContainer.addView(bottomRow);
              }

              private Button createSpecialButton(String text, float weight, View.OnClickListener listener) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setTextColor(Color.parseColor("#E4E4E7"));
                  btn.setTextSize(14);
                  btn.setTypeface(null, Typeface.BOLD);
                  btn.setAllCaps(false);
                  btn.setBackground(createButtonDrawable(Color.parseColor("#1E1E24"), Color.parseColor("#3F3F46")));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, 120, weight);
                  lp.setMargins(3, 0, 3, 0);
                  btn.setLayoutParams(lp);
                  btn.setOnClickListener(listener);
                  return btn;
              }

              private GradientDrawable createButtonDrawable(int bgColor, int strokeColor) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setShape(GradientDrawable.RECTANGLE);
                  drawable.setColor(bgColor);
                  drawable.setStroke(2, strokeColor);
                  drawable.setCornerRadius(14);
                  return drawable;
              }

              private void commitText(String text) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      ic.commitText(text, 1);
                  }
              }

              private void deleteChar() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      ic.deleteSurroundingText(1, 0);
                  }
              }

              private void sendEnterKey() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER));
                      ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER));
                  }
              }
          }
          EOF

          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FusionAIKeyboard-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
